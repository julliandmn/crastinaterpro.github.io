<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crastinaterpro</title>
</head>
<body style="font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: 0 auto;">

    <h1>Welcome to My Website</h1>
    <p>Sign up for my mailing list to stay updated!</p>

    <!-- The Form Structure -->
    <form id="newsletter-form" style="display: flex; gap: 10px; margin-top: 20px;">
        <input type="email" id="subscriber-email" placeholder="Your email address" required style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;" />
        <button type="submit" id="submit-btn" style="padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer;">Subscribe</button>
    </form>

    <!-- The Form Processing Logic -->
    <script>
        document.getElementById('newsletter-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const emailInput = document.getElementById('subscriber-email');
            const submitBtn = document.getElementById('submit-btn');
            const originalBtnText = submitBtn.innerText;
            
            // Visual loading state
            submitBtn.disabled = true;
            submitBtn.innerText = "Sending...";

            try {
                // Communicates directly with your unique Netlify Backend function URL
                const response = await fetch('nimble-sundae-e04d12.netlify.app', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailInput.value })
                });

                if (response.ok) {
                    alert('🎉 Success! You have been subscribed.');
                    emailInput.value = ''; // Clears the text field
                } else {
                    const errorResult = await response.json();
                    alert('Error: ' + (errorResult.error || 'Submission failed.'));
                }
            } catch (err) {
                alert('Network configuration error occurred.');
            } finally {
                // Re-enable interface controls
                submitBtn.disabled = false;
                submitBtn.innerText = originalBtnText;
            }
        });
    </script>

</body>
</html>
